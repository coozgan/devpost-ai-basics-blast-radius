<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blast Radius — what a Terraform change can reach</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #11161d;
    --line: #222b36;
    --ink: #c9d1d9;
    --dim: #8b949e;
    --new: #f85149;
    --prior: #7d8590;
    --unknown: #d29922;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--sans);
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: baseline; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    flex: none;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }

  /* --- reach counter: the kernel --- */
  .counter { display: flex; align-items: baseline; gap: 9px; font-family: var(--mono); margin-right: 4px; }
  .counter .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .counter .before { color: var(--prior); font-size: 34px; }
  .counter .arrow { color: var(--dim); font-size: 22px; }
  .counter .after { color: var(--new); font-size: 34px; font-weight: 700; }
  .counter .delta { color: #8b949e; font-size: 13px; }
  .counter[hidden] { display: none; }
  .legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--dim); align-items: center; }
  .legend[hidden] { display: none; }
  .legend i.sw { display: inline-block; width: 16px; height: 2px; margin-right: 6px; vertical-align: middle; }
  .legend i.prior { background: var(--prior); }
  .legend i.new { background: var(--new); }

  /* --- intake --- */
  #intake {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px;
  }
  #intake p { max-width: 54ch; text-align: center; color: var(--dim); margin: 0; }
  #intake textarea {
    width: min(760px, 100%); height: 190px; resize: vertical;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 12px; font: 12px/1.5 var(--mono);
  }
  #intake textarea:focus { outline: none; border-color: #30455c; }
  .actions { display: flex; gap: 10px; align-items: center; }
  button {
    background: #1b2430; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: #3a4a5c; }
  button.primary { background: #23303f; }
  #again { background: #141a22; color: var(--dim); }
  .hint { color: var(--dim); font-size: 12px; font-family: var(--mono); }

  /* --- result --- */
  #result { flex: 1; min-height: 0; display: none; grid-template-columns: 1fr 380px; }
  #result.on { display: grid; }
  #canvas-wrap { position: relative; min-width: 0; overflow: auto; padding: 8px;
    display: flex; align-items: center; justify-content: center; }
  svg { display: block; margin: auto; }

  .node rect { fill: #0f1419; stroke: var(--line); stroke-width: 1; rx: 4; }
  .node.principal rect { fill: #151d27; stroke: #3d5b7a; }
  .node.reached-new rect { stroke: var(--new); }
  .node.untouched rect { stroke: #1b232d; }
  .node.untouched text { fill: #93a0ad; }
  .node.untouched .type { fill: #8795a3; }
  .node text { font: 12.5px var(--mono); fill: var(--ink); }
  .node .type { font-size: 11px; fill: #9aa5b1; }
  .node { cursor: pointer; }

  path.edge { fill: none; stroke: var(--prior); stroke-width: 1.4; opacity: .7;
    paint-order: stroke; }
  path.edge.is-new { stroke: var(--new); stroke-width: 1.8; opacity: .9; }
  path.edge.unknown { stroke-dasharray: 4 3; stroke: var(--unknown); }
  .dimmed path.edge, .dimmed .node { opacity: .12; }
  .dimmed path.edge.lit { opacity: 1; }
  .dimmed .node.lit { opacity: 1; }

  /* --- findings panel --- */
  #panel {
    border-left: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  #panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
    margin: 0; padding: 12px 14px 8px;
  }
  #findings { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding-bottom: 18px;
    mask-image: linear-gradient(#000 calc(100% - 20px), transparent); }
  .finding {
    padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer;
    display: grid; gap: 4px;
  }
  .finding:hover { background: #151b23; }
  .finding.sel { background: #1a222c; }
  .finding .tag {
    font: 10px var(--mono); text-transform: uppercase; letter-spacing: .06em;
    justify-self: start; padding: 1px 6px; border-radius: 3px; border: 1px solid;
  }
  .tag.critical { color: var(--new); border-color: #5c2b2b; background: #2a1517; }
  .tag.high { color: var(--unknown); border-color: #5c4a22; background: #262013; }
  .tag.low { color: var(--dim); border-color: var(--line); background: #151b23; }
  .finding .text { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .finding .why { color: #9aa5b1; font-size: 12px; }
  .finding .src { color: #8b98a5; font: 11.5px var(--mono); }

  #caveats {
    border-top: 1px solid var(--line); padding: 10px 14px;
    color: var(--dim); font-size: 11px; display: grid; gap: 5px;
    flex: 0 0 auto; max-height: 34%; overflow-y: auto;
  }
  #caveats b { color: #8b949e; font-weight: 600; }

  .error { padding: 14px; color: var(--new); font-family: var(--mono); font-size: 12px; }
  .empty { padding: 14px; color: var(--dim); font-size: 12.5px; }

  /* collapsed intake bar */
  #bar { display: none; align-items: center; gap: 10px; }
  #bar.on { display: flex; }

  /* node popover */
  #pop {
    position: absolute; display: none; max-width: 420px; z-index: 5;
    background: #0b1017; border: 1px solid #30455c; border-radius: 6px;
    padding: 10px 12px; font-size: 11.5px; box-shadow: 0 8px 24px #0008;
  }
  #pop.on { display: block; }
  #pop .addr { font-family: var(--mono); font-size: 12px; margin-bottom: 6px; }
  #pop ul { margin: 4px 0 0; padding-left: 16px; color: var(--dim); }
  #pop li { font-family: var(--mono); font-size: 10.5px; margin-bottom: 3px; }
  #pop .close { float: right; color: var(--dim); cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>Blast Radius</h1>
  <span class="sub">what a Terraform change can reach</span>
  <span id="bar">
    <button id="again">Paste another plan</button>
    <span class="hint" id="planmeta"></span>
  </span>
  <span class="spacer"></span>
  <span class="counter" id="counter" hidden>
    <span class="label">reachable paths</span>
    <span class="before" id="c-before">—</span>
    <span class="arrow">→</span>
    <span class="after" id="c-after">—</span>
    <span class="delta" id="c-delta"></span>
  </span>
  <span class="legend" id="legend" hidden>
    <span><i class="sw prior"></i>reached before</span>
    <span><i class="sw new"></i>new reach</span>
  </span>
</header>

<section id="intake">
  <p>Paste the output of <code>terraform show -json &lt;planfile&gt;</code>.
     Everything is computed in this browser — the plan is never uploaded.</p>
  <textarea id="input" spellcheck="false" placeholder='{ "format_version": "1.2", "planned_values": { ... } }'></textarea>
  <div class="actions">
    <button class="primary" id="go">Analyze plan</button>
    <button id="example">Load the example plan</button>
  </div>
  <div class="hint" id="intake-error"></div>
</section>

<section id="result">
  <div id="canvas-wrap">
    <svg id="svg"></svg>
    <div id="pop"></div>
  </div>
  <aside id="panel">
    <h2>Findings</h2>
    <div id="findings"></div>
    <div id="caveats"></div>
  </aside>
</section>

<script type="module">
import { analyze } from "./reach.js";

const $ = (id) => document.getElementById(id);
const SEV = { critical: "critical", high: "high", low: "low" };
let current = null, selected = null;

/* ---------- layout: columns by BFS depth from principals ---------- */
const NODE_W = 232, NODE_H = 40, COL_GAP = 104, ROW_GAP = 18, PAD = 30;
const MAX_NODES = 40; // spec.md > Important Failure Modes

function layout(nodes, edges) {
  const depth = new Map();
  const adj = new Map();
  for (const e of edges) {
    if (!adj.has(e.from)) adj.set(e.from, []);
    adj.get(e.from).push(e.to);
  }
  const roots = nodes.filter((n) => n.isPrincipal).map((n) => n.address);
  const queue = roots.map((r) => [r, 0]);
  roots.forEach((r) => depth.set(r, 0));
  while (queue.length) {
    const [a, d] = queue.shift();
    for (const b of adj.get(a) || []) {
      if (depth.has(b) && depth.get(b) <= d + 1) continue;
      depth.set(b, d + 1);
      queue.push([b, d + 1]);
    }
  }
  const cols = new Map();
  for (const n of nodes) {
    const d = depth.get(n.address) ?? 1;
    if (!cols.has(d)) cols.set(d, []);
    cols.get(d).push(n);
  }
  const pos = new Map();
  const colKeys = [...cols.keys()].sort((a, b) => a - b);
  let maxRows = 0;
  for (const k of colKeys) maxRows = Math.max(maxRows, cols.get(k).length);
  // Spread rows to use the available height instead of floating in dead space.
  const wrapEl = document.getElementById("canvas-wrap");
  const targetH = Math.max(260, (wrapEl?.clientHeight || 520) - 24);
  const rowGap = Math.min(64, Math.max(ROW_GAP,
    (targetH - PAD * 2) / Math.max(1, maxRows) - NODE_H));
  const height = PAD * 2 + maxRows * (NODE_H + rowGap);
  colKeys.forEach((k, ci) => {
    const col = cols.get(k);
    const colH = col.length * (NODE_H + ROW_GAP);
    const top = (height - colH) / 2;
    col.forEach((n, ri) => {
      pos.set(n.address, {
        x: PAD + ci * (NODE_W + COL_GAP),
        y: top + ri * (NODE_H + rowGap),
      });
    });
  });
  return {
    pos,
    width: PAD * 2 + colKeys.length * (NODE_W + COL_GAP) - COL_GAP,
    height,
  };
}

const el = (name, attrs = {}, kids = []) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  for (const c of kids) n.appendChild(c);
  return n;
};

const shortLabel = (addr) => addr === "internet" ? "the public internet" : addr;
/** Clip to the box rather than letting a long address spill past its border. */
const fit = (s, max) => (s.length <= max ? s : s.slice(0, max - 1) + "\u2026");

function draw(r) {
  const svg = $("svg");
  svg.innerHTML = "";

  let nodes = r.nodes;
  let note = "";
  if (nodes.length > MAX_NODES) {
    const keep = new Set(r.findings.flatMap((f) => [f.root, f.target]));
    nodes = nodes.filter((n) => keep.has(n.address)).slice(0, MAX_NODES);
    note = `${r.nodes.length - nodes.length} further resources not drawn; see findings.`;
  }
  const shown = new Set(nodes.map((n) => n.address));
  const edges = r.edges.filter((e) => shown.has(e.from) && shown.has(e.to));
  const priorKeys = new Set(r.priorEdges.map((e) => `${e.from}|${e.to}`));

  const { pos, width, height } = layout(nodes, edges);
  const wrap = document.getElementById("canvas-wrap");
  const availW = Math.max(320, wrap.clientWidth - 16);
  const availH = Math.max(240, wrap.clientHeight - 16);
  const scale = Math.min(1.6, availW / width, availH / height);
  svg.setAttribute("width", Math.floor(width * scale));
  svg.setAttribute("height", Math.floor(height * scale));
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  const defs = el("defs");
  for (const [id, color] of [["arrow-prior", "#7d8590"], ["arrow-new", "#f85149"]]) {
    const m = el("marker", { id, viewBox: "0 0 8 8", refX: "7", refY: "4",
      markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse" });
    m.appendChild(el("path", { d: "M0,0 L8,4 L0,8 z", fill: color }));
    defs.appendChild(m);
  }
  svg.appendChild(defs);

  const gEdges = el("g");
  for (const e of edges) {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) continue;
    const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2;
    const x2 = b.x, y2 = b.y + NODE_H / 2;
    const mid = (x1 + x2) / 2;
    const isNew = !priorKeys.has(`${e.from}|${e.to}`);
    const d = `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`;
    gEdges.appendChild(el("path", {
      d,
      class: `edge${isNew ? " is-new" : ""}${e.unknown ? " unknown" : ""}`,
      "data-pair": `${e.from}->${e.to}`,
      "marker-end": `url(#${isNew ? "arrow-new" : "arrow-prior"})`,
    }));
  }
  svg.appendChild(gEdges); // beneath the nodes: a path hides behind an opaque box,
                           // it never crosses a label
  const newlyReached = new Set(r.findings.map((f) => f.target));
  for (const n of nodes) {
    const p = pos.get(n.address);
    const cls = ["node"];
    if (n.isPrincipal) cls.push("principal");
    if (newlyReached.has(n.address)) cls.push("reached-new");
    if (!n.changed && !newlyReached.has(n.address)) cls.push("untouched");
    const g = el("g", { class: cls.join(" "), "data-addr": n.address,
      transform: `translate(${p.x},${p.y})` });
    g.appendChild(el("rect", { width: NODE_W, height: NODE_H }));
    const tip = el("title");
    tip.textContent = `${shortLabel(n.address)} (${n.type})`;
    g.appendChild(tip);
    const label = el("text", { x: 11, y: 17 });
    label.textContent = fit(shortLabel(n.address), 26);
    const type = el("text", { x: 11, y: 31, class: "type" });
    type.textContent = fit(n.type, 30);
    g.appendChild(label);
    g.appendChild(type);
    g.addEventListener("click", (ev) => showNode(n, ev));
    svg.appendChild(g);
  }
  return note;
}

/* ---------- findings ---------- */
function renderFindings(r, note) {
  const box = $("findings");
  box.innerHTML = "";
  if (!r.findings.length) {
    box.innerHTML = `<div class="empty">This plan adds no new reach.
      Everything it touches was already reachable by the same principals.</div>`;
  }
  for (const f of r.findings) {
    const d = document.createElement("div");
    d.className = "finding";
    d.innerHTML = `<span class="tag ${SEV[f.severity]}">${f.severity}</span>
      <span class="text"></span><span class="why"></span><span class="src"></span>`;
    d.querySelector(".text").textContent = f.text;
    d.querySelector(".why").textContent = f.rule + (f.widened ? " (existing path widened)" : "");
    d.querySelector(".src").textContent = f.source;
    d.addEventListener("click", () => select(f, d));
    box.appendChild(d);
  }

  const c = $("caveats");
  c.innerHTML = "<b>What this does not evaluate</b>";
  for (const line of r.caveats.concat(note ? [note] : [])) {
    const p = document.createElement("div");
    p.textContent = line;
    c.appendChild(p);
  }
}

function select(f, node) {
  const svg = $("svg");
  document.querySelectorAll(".finding.sel").forEach((n) => n.classList.remove("sel"));
  svg.querySelectorAll(".lit").forEach((n) => n.classList.remove("lit"));
  if (selected === f.id) { selected = null; svg.classList.remove("dimmed"); return; }
  selected = f.id;
  node.classList.add("sel");
  svg.classList.add("dimmed");
  const path = svg.querySelector(`path[data-pair="${f.root}->${f.target}"]`);
  if (path) path.classList.add("lit");
  for (const addr of [f.root, f.target]) {
    const g = svg.querySelector(`.node[data-addr="${addr}"]`);
    if (g) g.classList.add("lit");
  }
}

function showNode(n, ev) {
  const pop = $("pop");
  const inbound = current.edges.filter((e) => e.to === n.address);
  const wrap = $("canvas-wrap");
  pop.innerHTML = `<span class="close">close</span>
    <div class="addr">${shortLabel(n.address)}</div>
    <div style="color:var(--dim)">${n.type}${n.changed ? " · changed by this plan" : ""}</div>
    <ul>${inbound.length
      ? inbound.map((e) => `<li>${e.kind}: ${e.label}<br>${e.source}</li>`).join("")
      : "<li>no inbound edges in this plan</li>"}</ul>`;
  pop.classList.add("on");
  pop.style.left = Math.min(ev.offsetX + 16, wrap.clientWidth - 440) + "px";
  pop.style.top = (ev.offsetY + 16) + "px";
  pop.querySelector(".close").addEventListener("click", () => pop.classList.remove("on"));
  ev.stopPropagation();
}

/* ---------- intake ---------- */
function run(text, meta) {
  const err = $("intake-error");
  err.textContent = "";
  let plan;
  try {
    plan = JSON.parse(text);
  } catch (e) {
    err.textContent = `Cannot parse as JSON: ${e.message}`;
    return;
  }
  let r;
  try {
    r = analyze(plan);
  } catch (e) {
    err.textContent = e.message;
    return;
  }
  current = r;
  selected = null;

  // Reveal first: draw() measures #canvas-wrap to fit the graph, and a hidden
  // grid child reports a near-zero width.
  $("intake").style.display = "none";
  $("result").classList.add("on");
  $("bar").classList.add("on");

  const note = draw(r);
  renderFindings(r, note);

  $("c-before").textContent = r.counts.prior === null ? "—" : r.counts.prior;
  $("c-after").textContent = r.counts.planned;
  $("c-delta").textContent = r.counts.delta === null
    ? "no prior state" : r.counts.delta > 0 ? `+${r.counts.delta} new` : "no change";
  $("counter").hidden = false;
  $("legend").hidden = false;
  $("planmeta").textContent = meta || "";
}

$("go").addEventListener("click", () => {
  const v = $("input").value.trim();
  if (!v) { $("intake-error").textContent = "Paste a plan first, or load the example."; return; }
  run(v, "pasted plan");
});

$("example").addEventListener("click", async () => {
  try {
    const res = await fetch("./demo/plan.json");
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    run(await res.text(), "demo/plan.json · terraform 1.13.1");
  } catch (e) {
    $("intake-error").textContent = `Could not load the example: ${e.message}`;
  }
});

$("again").addEventListener("click", () => {
  $("result").classList.remove("on");
  $("bar").classList.remove("on");
  $("counter").hidden = true;
  $("legend").hidden = true;
  $("pop").classList.remove("on");
  $("intake").style.display = "flex";
});

let resizeTimer;
window.addEventListener("resize", () => {
  if (!current) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => renderFindings(current, draw(current)), 120);
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".node") && !e.target.closest("#pop")) $("pop").classList.remove("on");
});
</script>
</body>
</html>
